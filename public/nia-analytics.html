<!DOCTYPE html>
<html lang="en" data-theme="dark" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>راصد · منصة تحليل النتائج</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0b1020; --bg-2:#111834; --panel:#151d3b; --panel-2:#1b2547;
  --line:#26315c; --txt:#e8edff; --txt-dim:#9aa6cf; --txt-mut:#6b78a8;
  --brand:#5b8cff; --brand-2:#7c5cff; --accent:#22d3ee;
  --good:#34d399; --warn:#fbbf24; --bad:#f87171; --gold:#facc15;
  --shadow:0 10px 40px rgba(0,0,0,.45); --radius:16px;
  --grad:linear-gradient(135deg,#5b8cff 0%,#7c5cff 60%,#22d3ee 130%);
}
html[data-theme="light"]{
  --bg:#eef1f9; --bg-2:#e3e8f6; --panel:#ffffff; --panel-2:#f5f7ff;
  --line:#dfe4f3; --txt:#1a2138; --txt-dim:#5a6485; --txt-mut:#8a93b5;
  --brand:#3b6fe0; --brand-2:#6d4bff; --accent:#0ea5b7; --shadow:0 8px 30px rgba(40,60,120,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI','Tahoma',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt);display:flex;min-height:100vh;transition:background .4s,color .4s}
html[dir="rtl"] body{font-family:'Tahoma','Segoe UI',sans-serif}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}::-webkit-scrollbar-track{background:transparent}
.sidebar{width:252px;flex-shrink:0;background:var(--bg-2);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;transition:.3s}
.brand{padding:20px 18px;display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--line)}
.brand-logo{width:40px;height:40px;border-radius:11px;background:var(--grad);display:grid;place-items:center;font-weight:800;color:#fff;font-size:17px;box-shadow:0 6px 18px rgba(91,140,255,.4)}
.brand-txt b{font-size:15px;letter-spacing:.3px}.brand-txt span{display:block;font-size:10.5px;color:var(--txt-mut);letter-spacing:1.5px;text-transform:uppercase}
.nav{flex:1;overflow-y:auto;padding:12px 10px}
.nav-group{font-size:10px;text-transform:uppercase;letter-spacing:1.4px;color:var(--txt-mut);padding:14px 12px 6px;font-weight:700}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;cursor:pointer;color:var(--txt-dim);font-size:13.5px;font-weight:500;transition:.18s;margin-bottom:2px}
.nav-item:hover{background:var(--panel);color:var(--txt)}
.nav-item.active{background:var(--grad);color:#fff;box-shadow:0 6px 16px rgba(91,140,255,.35)}
.nav-item .ic{width:18px;text-align:center;font-size:15px}
.lock{margin-inline-start:auto;font-size:12px;opacity:.7}
.sb-foot{padding:14px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--txt-mut)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.page-title{font-size:18px;font-weight:700}.page-title small{display:block;font-size:11.5px;color:var(--txt-mut);font-weight:400;margin-top:1px}
.spacer{flex:1}
.search{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 12px;min-width:190px}
.search input{background:none;border:none;outline:none;color:var(--txt);font-size:13px;width:100%}
.search input::placeholder{color:var(--txt-mut)}
.icon-btn{height:38px;min-width:38px;padding:0 10px;border-radius:10px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;cursor:pointer;color:var(--txt-dim);font-size:14px;font-weight:700;transition:.18s}
.icon-btn:hover{color:var(--txt);border-color:var(--brand)}
.content{padding:20px 22px 50px;flex:1}
.srcbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 22px;border-bottom:1px solid var(--line);background:var(--panel-2)}
.srcbar .lbl{font-size:11px;font-weight:700;letter-spacing:.6px;color:var(--txt-mut);text-transform:uppercase}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:flex-end}
.filter{display:flex;flex-direction:column;gap:3px}
.filter label{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--txt-mut);font-weight:700;padding-inline-start:2px}
.filter select{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:7px 11px;font-size:12.5px;outline:none;cursor:pointer;min-width:128px}
.filter select:focus{border-color:var(--brand)}
.chip{background:var(--panel-2);border:1px solid var(--line);border-radius:20px;padding:6px 13px;font-size:12px;cursor:pointer;color:var(--txt-dim);font-weight:600;transition:.15s}
.chip.on{background:var(--grad);color:#fff;border-color:transparent}
.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(auto-fit,minmax(178px,1fr))}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 17px;position:relative;overflow:hidden;box-shadow:var(--shadow);transition:.25s}
.kpi:hover{transform:translateY(-3px);border-color:var(--brand)}
.kpi::after{content:'';position:absolute;inset-inline-end:-20px;top:-20px;width:78px;height:78px;border-radius:50%;background:var(--grad);opacity:.13}
.kpi .kl{font-size:11.5px;color:var(--txt-dim);font-weight:600;display:flex;align-items:center;gap:7px}.kpi .kl .e{font-size:15px}
.kpi .kv{font-size:28px;font-weight:800;margin-top:8px;letter-spacing:-.5px}
.kpi .kd{font-size:11.5px;margin-top:5px;font-weight:600}
.kd.up{color:var(--good)}.kd.down{color:var(--bad)}.kd.mut{color:var(--txt-mut)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.panel h3{font-size:14px;font-weight:700;margin-bottom:3px;display:flex;align-items:center;gap:8px}
.panel .sub{font-size:11.5px;color:var(--txt-mut);margin-bottom:14px}
.row{display:grid;gap:14px}.r-2{grid-template-columns:1fr 1fr}.r-3{grid-template-columns:1fr 1fr 1fr}.r-23{grid-template-columns:1.6fr 1fr}.r-32{grid-template-columns:1fr 1.6fr}
@media(max-width:1050px){.r-2,.r-3,.r-23,.r-32{grid-template-columns:1fr}}
.cv{position:relative;height:260px}.cv.sm{height:210px}.cv.lg{height:320px}
.insight{display:flex;gap:12px;padding:12px 14px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line);margin-bottom:10px;align-items:flex-start}
.insight .bdg{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex-shrink:0;font-size:16px}
.insight b{font-size:13px}.insight p{font-size:12px;color:var(--txt-dim);margin-top:2px;line-height:1.5}
.b-good{background:rgba(52,211,153,.16);color:var(--good)}.b-warn{background:rgba(251,191,36,.16);color:var(--warn)}.b-bad{background:rgba(248,113,113,.16);color:var(--bad)}.b-info{background:rgba(91,140,255,.16);color:var(--brand)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:start;color:var(--txt-mut);font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;padding:9px 10px;border-bottom:1px solid var(--line);font-weight:700}
td{padding:10px;border-bottom:1px solid var(--line);color:var(--txt-dim)}
tr:last-child td{border-bottom:none}tr:hover td{color:var(--txt);background:var(--panel-2)}
.rank{width:26px;height:26px;border-radius:8px;display:inline-grid;place-items:center;font-weight:800;font-size:12px}
.rk1{background:var(--gold);color:#3a2c00}.rk2{background:#cbd5e1;color:#1e293b}.rk3{background:#d97742;color:#fff}.rkx{background:var(--panel-2);color:var(--txt-dim)}
.bar{height:7px;border-radius:6px;background:var(--line);overflow:hidden;min-width:70px}.bar i{display:block;height:100%;border-radius:6px;background:var(--grad)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-inline-end:6px;vertical-align:middle}
.prof-head{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.avatar{width:70px;height:70px;border-radius:18px;background:var(--grad);display:grid;place-items:center;font-size:26px;font-weight:800;color:#fff;flex-shrink:0}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.tag{background:var(--panel-2);border:1px solid var(--line);padding:4px 11px;border-radius:8px;font-size:11.5px;color:var(--txt-dim)}
.risk{margin-inline-start:auto;text-align:center;padding:10px 18px;border-radius:14px;font-weight:800;font-size:13px}
.gauge-wrap{display:flex;flex-direction:column;align-items:center}
.list-li{display:flex;align-items:center;gap:9px;padding:8px 0;font-size:13px;border-bottom:1px solid var(--line)}.list-li:last-child{border:none}
.heat td{text-align:center;font-weight:700;color:#fff;border:2px solid var(--bg);border-radius:6px}.heat th{text-align:center}
.fade{animation:fade .45s ease}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--txt-dim);margin-top:10px}.legend span{display:flex;align-items:center;gap:6px}
.gate{max-width:420px;margin:60px auto;text-align:center}
.gate .lk{width:64px;height:64px;border-radius:18px;background:var(--grad);display:grid;place-items:center;font-size:28px;margin:0 auto 18px}
.gate input{width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:11px 14px;font-size:14px;outline:none;margin:14px 0}
.gate button{width:100%;background:var(--grad);color:#fff;border:none;border-radius:10px;padding:11px;font-size:14px;font-weight:700;cursor:pointer}
.mobtog{display:none}
.loader{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:99;transition:opacity .4s}
.loader .ring{width:54px;height:54px;border:4px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:820px){.sidebar{position:fixed;inset-inline-start:-260px;z-index:60}.sidebar.open{inset-inline-start:0}.mobtog{display:grid}}
</style>
</head>
<body>
<div class="loader" id="loader"><div style="text-align:center"><div class="ring"></div><div id="loaderTxt" style="margin-top:16px;color:var(--txt-dim);font-size:13px">Loading…</div></div></div>

<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="brand-logo" style="font-size:13px">راصد</div><div class="brand-txt"><b id="brandName">راصد</b><span>Analytics Platform</span></div></div>
  <nav class="nav" id="nav"></nav>
  <div class="sb-foot" id="foot">Connecting…</div>
  <div id="uploadLinkSb" style="display:none;padding:10px 16px;border-top:1px solid var(--line)">
    <a href="/dashboard/upload" style="display:flex;align-items:center;gap:8px;background:var(--grad);color:#fff;padding:8px 14px;border-radius:10px;text-decoration:none;font-size:12.5px;font-weight:700">
      <span>📤</span><span>رفع بيانات</span>
    </a>
  </div>
</aside>

<div class="main">
  <header class="topbar">
    <div class="icon-btn mobtog" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</div>
    <div class="page-title" id="pgTitle">—<small id="pgSub"></small></div>
    <div class="spacer"></div>
    <div class="search"><span>🔎</span><input id="globalSearch" placeholder="Search student…" autocomplete="off" /></div>
    <div class="icon-btn" id="langBtn" title="Language">AR</div>
    <div class="icon-btn" id="themeBtn" title="Theme">🌙</div>
    <div class="icon-btn" id="reloadBtn" title="Reload" onclick="loadData(true)">🔄</div>
  </header>
  <div class="srcbar"><span class="lbl" id="liveLbl">Live Data</span><span id="srcDot" class="dot" style="background:var(--warn)"></span><span id="srcStatus" style="font-size:12.5px;color:var(--txt-dim)">Connecting…</span></div>
  <main class="content" id="content"></main>
</div>

  var identityIdx=new Set(Object.values(idc).filter(function(i){return i>=0;}));

  // group prefixed columns: prefix -> {assess:[], scoreIdx, gradeIdx}
  var groups={};
  headers.forEach(function(h,i){
    if(identityIdx.has(i)) return;
    var m=h.match(/^([A-Za-z]+)\s*-\s*(.+)$/);
    if(!m) return;
    var pref=m[1], suf=m[2].trim().toLowerCase();
    groups[pref]=groups[pref]||{assess:[],scoreIdx:-1,gradeIdx:-1};
    if(suf==='score%'||suf==='score'||suf==='score %') groups[pref].scoreIdx=i;
    else if(suf==='grade') groups[pref].gradeIdx=i;
    else groups[pref].assess.push(i);
  });

      if(sc>bestScore){bestScore=sc;best=o.tch;}

  RECORDS=[];

    var sem=idc.semester>=0?String(r[idc.semester]||'').trim():'';
    var yr=idc.year>=0?String(r[idc.year]||'').trim():'';
    var sch=idc.school>=0?String(r[idc.school]||'').trim():'';
    if(!name && !cls) return;
    var sid=sch+'|'+name+'|'+grade+'|'+cls;  // person key (counted once across semesters/years)
    subjPrefixes.forEach(function(p){
      var g=groups[p];

      if(!hasData) return;

        school:idc.school>=0?String(r[idc.school]||'').trim():'',
        grade:grade, class:cls, stage:idc.stage>=0?String(r[idc.stage]||'').trim():'',
        semester:sem, year:yr, subject:subjName,

function ingestSupabase(p){

      var sMatch=String(o.subject||o.Subject||'').trim()===subj;
      var sects=o.sections||o.Sections||[];
      if(sMatch&&Array.isArray(sects)&&sects.length)
        return sects.some(function(s){return String(s).trim()===cls;});

    });

  }
  RECORDS=[];
  rows.forEach(function(row){
    var name=String(row.name||'').trim();

  ALL_ASSESS=['Q1','Q2','Q3','Q4'];
  ASSESS_BY_SUBJECT={};
  SUBJECTS.forEach(function(s){
    var present=new Set();

    ASSESS_BY_SUBJECT[s]=['Q1','Q2','Q3','Q4'].filter(function(q){return present.has(q);});
  });
  GRADE_ORDER=(DIMS.grade||[]).slice().sort(function(a,b){
    var na=parseInt(String(a).replace(/\D/g,''),10),nb=parseInt(String(b).replace(/\D/g,''),10);

}

function genInsights(d){
  var out=[];
  if(!d.length){return '<div class="insight"><div class="bdg b-info">ℹ️</div><div><b>'+L('No data','لا توجد بيانات')+'</b><p>'+L('Adjust the filters to see insights.','عدّل الفلاتر لعرض الاستنتاجات.')+'</p></div></div>';}
  var nStu=uniq(d.map(function(r){return r.id;})).length;
  var sStats=SUBJECTS.map(function(s){return {s:s,a:avg(d.filter(function(r){return r.subject===s;}).map(gs))};}).filter(function(x){return x.a;}).sort(function(x,y){return y.a-x.a;});
  if(sStats.length>1){var gap=r1(sStats[0].a-sStats[sStats.length-1].a);
    out.push(['good','🏅',L('Strongest subject: ','أقوى مادة: ')+tv(sStats[0].s)+' ('+r1(sStats[0].a)+'%)',
      L('Leads '+tv(sStats[sStats.length-1].s)+' ('+r1(sStats[sStats.length-1].a)+'%) by '+gap+' points. Consider sharing its teaching practices with weaker subjects.',
        'تتقدّم على '+tv(sStats[sStats.length-1].s)+' ('+r1(sStats[sStats.length-1].a)+'٪) بفارق '+gap+' نقطة. يُنصح بنقل ممارساتها التدريسية للمواد الأضعف.')]);}
  sStats.forEach(function(x){var tg=targetFor(x.s,F.year);var diff=r1(x.a-tg);
    if(diff<0) out.push(['warn','🎯',tv(x.s)+' '+L('below target','تحت الهدف'),
      L(tv(x.s)+' averages '+r1(x.a)+'%, '+Math.abs(diff)+' points under its '+tg+'% target — flag for academic support.',
        tv(x.s)+' بمتوسط '+r1(x.a)+'٪، أقل بـ '+Math.abs(diff)+' نقطة عن هدفها '+tg+'٪ — تستدعي خطة دعم.')]);
    else out.push(['good','🎯',tv(x.s)+' '+L('meets target','حقّقت الهدف'),
      L(tv(x.s)+' is '+diff+' points above its '+tg+'% target.',tv(x.s)+' تتجاوز هدفها '+tg+'٪ بـ '+diff+' نقطة.')]);});
  var improves=[];
  (DIMS.grade||[]).forEach(function(g){SUBJECTS.forEach(function(s){var seq=subjAssess(s);if(seq.length<2)return;var rs=d.filter(function(r){return r.grade===g&&r.subject===s;});if(rs.length<3)return;var f=avg(rs.map(function(r){return r.assess[seq[0]];}).filter(function(v){return v!=null;}));var l=avg(rs.map(function(r){return r.assess[seq[seq.length-1]];}).filter(function(v){return v!=null;}));improves.push({g:g,s:s,d:l-f,f:seq[0],l:seq[seq.length-1]});});});
  improves.sort(function(a,b){return b.d-a.d;});
  if(improves.length&&improves[0].d>5)out.push(['good','📈',L('Most improved: ','الأكثر تحسّنًا: ')+improves[0].g+' '+tv(improves[0].s).split(' ')[0],L('Rose '+r1(improves[0].d)+'% from '+improves[0].f+' to '+improves[0].l+' — clear upward trend.','ارتفع '+r1(improves[0].d)+'٪ من '+improves[0].f+' إلى '+improves[0].l+' — اتجاه صاعد واضح.')]);
  if(improves.length){var worst=improves[improves.length-1];if(worst.d<-5)out.push(['bad','📉',L('Largest decline: ','الأكبر تراجعًا: ')+worst.g+' '+tv(worst.s).split(' ')[0],L('Dropped '+r1(worst.d)+'% from '+worst.f+' to '+worst.l+'. Review pacing & revision.','تراجع '+r1(worst.d)+'٪ من '+worst.f+' إلى '+worst.l+'. راجع الخطة والمراجعة.')]);}
  var cStats=(DIMS.class||[]).map(function(c){return {c:c,a:avg(d.filter(function(r){return r.class===c;}).map(gs))};}).filter(function(x){return x.a;}).sort(function(x,y){return y.a-x.a;});
  if(cStats.length){out.push(['info','🏫',L('Top class: ','أعلى فصل: ')+cStats[0].c+' ('+r1(cStats[0].a)+'%)',L('Highest-performing section in the current selection.','أعلى شعبة أداءً ضمن التحديد الحالي.')]);var wc=cStats[cStats.length-1];if(wc.a<70)out.push(['bad','🚨',L('Needs intervention: ','يحتاج تدخّلًا: ')+wc.c+' ('+r1(wc.a)+'%)',L('Lowest section average — recommend a targeted plan and monitoring.','أدنى متوسط شعبة — يُنصح بخطة مركّزة ومتابعة.')]);}
  var risk=uniq(d.filter(function(r){return gs(r)<RISK;}).map(function(r){return r.id;})).length;
  if(risk>0)out.push(['warn','⚠️',L(risk+' students at risk','طلاب في خطر: '+risk),L(r1(risk/nStu*100)+'% of students have at least one subject below '+RISK+'%. Prioritise for support.',r1(risk/nStu*100)+'٪ من الطلاب لديهم مادة على الأقل تحت '+RISK+'٪. أولويتهم للدعم.')]);
  var sd=stdev(d.map(gs));
  out.push([sd<8?'good':sd<14?'info':'warn','📐',L('Score consistency','تجانس الدرجات')+' (SD '+r1(sd)+')',sd<8?L('Scores are tightly clustered — performance is consistent.','الدرجات متقاربة — الأداء متجانس.'):sd<14?L('Moderate spread between students.','تشتّت متوسط بين الطلاب.'):L('Wide spread — large gaps; consider differentiated teaching.','تشتّت واسع — فجوات كبيرة؛ يُنصح بالتعليم المتمايز.')]);
  if((DIMS.school||[]).length>1){var sc=DIMS.school.map(function(x){return {n:x,a:avg(d.filter(function(r){return r.school===x;}).map(gs))};}).sort(function(a,b){return b.a-a.a;});var sgap=r1(sc[0].a-sc[sc.length-1].a);if(sgap>3)out.push(['info','🏢',L('School gap','فارق المدارس'),L(tv(sc[0].n)+' leads '+tv(sc[sc.length-1].n)+' by '+sgap+' points ('+r1(sc[0].a)+'% vs '+r1(sc[sc.length-1].a)+'%).',tv(sc[0].n)+' متقدّمة على '+tv(sc[sc.length-1].n)+' بـ '+sgap+' نقطة ('+r1(sc[0].a)+'٪ مقابل '+r1(sc[sc.length-1].a)+'٪).')]);}
  return out.slice(0,12).map(function(a){return '<div class="insight"><div class="bdg b-'+a[0]+'">'+a[1]+'</div><div><b>'+a[2]+'</b><p>'+a[3]+'</p></div></div>';}).join('');
}

function vExec(){
  var d=applyFilters(RECORDS);var scores=d.map(gs);
  var above=d.filter(function(r){return gs(r)>=r.target;}).length;
  var below=d.filter(function(r){return gs(r)<r.target;}).length;
  var atRisk=uniq(d.filter(function(r){return gs(r)<RISK;}).map(function(r){return r.id;})).length;
  var sd=r1(stdev(scores));
  var cards=kpiCard(t('kTotal'),'👥',uniq(d.map(function(r){return r.id;})).length,t('enrolled'),'mut')+
    kpiCard(t('kAvg'),'📊',r1(avg(scores))+'%',(avg(scores)>=DEFAULT_TARGET?t('aboveT'):t('belowT')),avg(scores)>=DEFAULT_TARGET?'up':'down')+
    kpiCard(t('kHigh'),'🥇',(scores.length?Math.max.apply(null,scores):0)+'%',t('topPerf'),'up')+
    kpiCard(t('kLow'),'🔻',(scores.length?Math.min.apply(null,scores):0)+'%',t('needsSup'),'down')+
    kpiCard(t('kAbove'),'✅',above,r1(above/(d.length||1)*100)+t('ofRecords'),'up')+
    kpiCard(t('kBelow'),'⚠️',below,r1(below/(d.length||1)*100)+t('ofRecords'),'down')+
    kpiCard(t('kRisk'),'🚨',atRisk,'< '+RISK+'%','down')+
    kpiCard(t('kSD'),'📐',sd,(sd<8?t('sdLow'):sd<14?t('sdMid'):t('sdHigh')),sd<8?'up':sd<14?'mut':'down')+
    kpiCard(t('kClasses'),'🏫',uniq(d.map(function(r){return r.class;}).filter(Boolean)).length,t('activeSec'),'mut')+
    kpiCard(t('kTeachers'),'👩‍🏫',uniq(d.map(function(r){return r.teacher;}).filter(Boolean)).length,t('instructors'),'mut');
  if((DIMS.school||[]).length>1)cards+=kpiCard(t('kSchools'),'🏢',uniq(d.map(function(r){return r.school;}).filter(Boolean)).length,t('inScope'),'mut');
  C().innerHTML=filterBar(['school','stage','grade','class','subject','teacher','assess','semester','year','perf'])+
    '<div class="grid kpis" style="margin-bottom:14px">'+cards+'</div>'+
    '<div class="row r-23" style="margin-bottom:14px"><div class="panel"><h3>📈 '+t('subjCompare')+'</h3><div class="sub">'+t('avgPerSubject')+'</div><div class="cv"><canvas id="cSubj"></canvas></div></div>'+
    '<div class="panel"><h3>🎯 '+t('perfDist')+'</h3><div class="sub">'+t('spreadLetters')+'</div><div class="cv"><canvas id="cDist"></canvas></div></div></div>'+
    '<div class="row r-2" style="margin-bottom:14px"><div class="panel"><h3>🏆 '+t('topClasses')+'</h3><div class="sub">'+t('highestSec')+'</div><div id="topCls"></div></div>'+
    '<div class="panel"><h3>🚨 '+t('lowClasses')+'</h3><div class="sub">'+t('lowestSec')+'</div><div id="lowCls"></div></div></div>'+
    '<div class="row r-2" style="margin-bottom:14px"><div class="panel"><h3>🌡️ '+t('heatmap')+'</h3><div class="sub">'+t('intensity')+'</div><div id="heat"></div></div>'+
    '<div class="panel"><h3>💡 '+t('autoInsights')+'</h3><div class="sub">'+t('engineHi')+'</div><div id="ins"></div></div></div>';
  bindFilters();
  var sAvg=SUBJECTS.map(function(s){return r1(avg(d.filter(function(r){return r.subject===s;}).map(gs)));});
  mk(document.getElementById('cSubj'),{type:'bar',data:{labels:SUBJECTS.map(tv),datasets:[{data:sAvg,backgroundColor:PAL,borderRadius:8,maxBarThickness:70}]},
    options:baseOpts({plugins:{legend:{display:false}},scales:{y:{min:0,max:100,ticks:{color:css('--txt-mut')},grid:{color:gridClr()}},x:{grid:{display:false},ticks:{color:css('--txt-dim')}}}})});
  var perf=DIMS.perf||[];
  mk(document.getElementById('cDist'),{type:'doughnut',data:{labels:perf,datasets:[{data:perf.map(function(p){return d.filter(function(r){return r.perf===p;}).length;}),backgroundColor:PAL,borderWidth:0}]},
    options:baseOpts({cutout:'62%',scales:{},plugins:{legend:{position:'right',labels:{color:css('--txt-dim'),font:{size:11},boxWidth:11}}}})});
  var cls=uniq(d.map(function(r){return r.class;}).filter(Boolean)).map(function(c){return {n:c,a:avg(d.filter(function(r){return r.class===c;}).map(gs))};});
  leaderTable(cls,'topCls',5,true); leaderTable(cls,'lowCls',5,false);
  renderHeat(d,'heat');
  document.getElementById('ins').innerHTML=genInsights(d);
}

    options:baseOpts({scales:{y:{min:0,max:100,ticks:{color:css('--txt-mut')},grid:{color:gridClr()}},x:{grid:{display:false},ticks:{color:css('--txt-dim')}}}})});
  var og=GRADE_ORDER.filter(function(g){return d.some(function(r){return r.grade===g;});});
  mk(document.getElementById('gwBar'),{type:'bar',data:{labels:og,datasets:SUBJECTS.map(function(s,i){var seq=subjAssess(s);var f=seq[0],l=seq[seq.length-1];return {label:tv(s).split(' ')[0],data:og.map(function(g){var rs=d.filter(function(r){return r.grade===g&&r.subject===s;});return rs.length&&seq.length>1?r1(avg(rs.map(function(r){return r.assess[l];}).filter(function(v){return v!=null;}))-avg(rs.map(function(r){return r.assess[f];}).filter(function(v){return v!=null;}))):0;}),backgroundColor:PAL[i%PAL.length],borderRadius:5};})},
    options:baseOpts({scales:{y:{ticks:{color:css('--txt-mut')},grid:{color:gridClr()}},x:{grid:{display:false},ticks:{color:css('--txt-dim'),font:{size:9}}}}})});
}

function vDist(){
  var d=applyFilters(RECORDS);var perf=DIMS.perf||[];
  if(!perf.length){C().innerHTML='<div class="panel"><h3>'+t('dist')+'</h3><p class="sub">'+t('noData')+'</p></div>';return;}
  var counts=perf.map(function(p){return d.filter(function(r){return r.perf===p;}).length;});var total=d.length||1;
  C().innerHTML=filterBar(['school','stage','grade','subject','class','perf','semester','year'])+
    '<div class="grid kpis" style="margin-bottom:14px">'+perf.slice(0,Math.min(4,perf.length)).map(function(p,i){return kpiCard(p,'🏷️',counts[i],r1(counts[i]/total*100)+t('ofRecords'),i<2?'up':'down');}).join('')+'</div>'+
    '<div class="row r-2"><div class="panel"><h3>🎯 '+t('perfBars')+'</h3><div class="sub">'+t('countPer')+'</div><div class="cv lg"><canvas id="dBar"></canvas></div></div>'+
    '<div class="panel"><h3>🍩 '+t('propSpread')+'</h3><div class="sub">'+t('shareEach')+'</div><div class="cv lg"><canvas id="dDonut"></canvas></div></div></div>';
  bindFilters();
  mk(document.getElementById('dBar'),{type:'bar',data:{labels:perf,datasets:[{data:counts,backgroundColor:PAL,borderRadius:8}]},
    options:baseOpts({plugins:{legend:{display:false}},scales:{y:{ticks:{color:css('--txt-mut')},grid:{color:gridClr()}},x:{grid:{display:false},ticks:{color:css('--txt-dim'),font:{weight:'700'}}}}})});
  mk(document.getElementById('dDonut'),{type:'doughnut',data:{labels:perf,datasets:[{data:counts,backgroundColor:PAL,borderWidth:0}]},
    options:baseOpts({cutout:'58%',scales:{},plugins:{legend:{position:'right',labels:{color:css('--txt-dim'),boxWidth:12,font:{size:12}}}}})});
}

/* ============================================================ nav + router ============================================================ */
function buildNav(){
  var html='<div class="nav-group">'+t('gOverview')+'</div>'+
    navItem('exec','📊',t('exec'))+navItem('insights','💡',t('insights'))+
    '<div class="nav-group">'+t('gSubjects')+'</div>'+SUBJECTS.map(function(s){return '<div class="nav-item" data-view="subj:'+s+'"><span class="ic">📘</span> '+tv(s)+'</div>';}).join('')+
    '<div class="nav-group">'+t('gCohorts')+'</div>'+navItem('stage','🏛️',t('stage'))+navItem('grade','🎓',t('grade'))+navItem('class','🏫',t('classv'))+
    '<div class="nav-item" data-view="teacher"><span class="ic">👩‍🏫</span> '+t('teacher')+'<span class="lock">🔒</span></div>'+
    '<div class="nav-group">'+t('gPeople')+'</div>'+navItem('student','🧑‍🎓',t('student'))+navItem('ranks','🏆',t('ranks'))+navItem('growth','📈',t('growth'))+navItem('dist','🎯',t('dist'));
  document.getElementById('nav').innerHTML=html;
  setActiveNav(CURRENT);
}
function navItem(v,ic,label){return '<div class="nav-item" data-view="'+v+'"><span class="ic">'+ic+'</span> '+label+'</div>';}
function setActiveNav(v){document.querySelectorAll('.nav-item').forEach(function(n){n.classList.toggle('active',n.dataset.view===v);});}

var SUBV={exec:vExec,insights:vInsights,stage:vStage,grade:vGrade,class:vClass,teacher:vTeacher,student:vStudent,ranks:vRanks,growth:vGrowth,dist:vDist};
function titleFor(v){
  if(v.indexOf('subj:')===0)return [tv(v.slice(5)),t('subjectSub')];
  var map={exec:['exec','execSub'],insights:['insights','insightsSub'],stage:['stage','stageSub'],grade:['grade','gradeSub'],class:['classv','classSub'],teacher:['teacher','teacherSub'],student:['student','studentSub'],ranks:['ranks','ranksSub'],growth:['growth','growthSub'],dist:['dist','distSub']};
  var m=map[v]||map.exec;return [t(m[0]),t(m[1])];
}
function render(view){
  CURRENT=view;destroyCharts();
  if(view.indexOf('subj:')===0){vSubject(view.slice(5));}
  else (SUBV[view]||vExec)();
  var ttl=titleFor(view);
  document.getElementById('pgTitle').childNodes[0].nodeValue=ttl[0];
  document.getElementById('pgSub').textContent=ttl[1];
}

document.getElementById('nav').addEventListener('click',function(e){var it=e.target.closest('.nav-item');if(!it)return;
  var v=it.dataset.view;if(v.indexOf('subj:')!==0)F.subject='';
  setActiveNav(v);render(v);document.getElementById('sidebar').classList.remove('open');});

function applyChrome(){
  document.getElementById('brandName').textContent=t('brand');
  document.getElementById('liveLbl').textContent=t('live');
  document.getElementById('globalSearch').placeholder=t('search');
  document.getElementById('langBtn').textContent=LANG==='en'?'ع':'EN';
}
document.getElementById('langBtn').onclick=function(){
  LANG=LANG==='en'?'ar':'en';
  document.documentElement.lang=LANG;document.documentElement.dir=LANG==='ar'?'rtl':'ltr';
  applyChrome();buildNav();render(CURRENT);
};
document.getElementById('themeBtn').onclick=function(){var h=document.documentElement,dark=h.getAttribute('data-theme')==='dark';h.setAttribute('data-theme',dark?'light':'dark');document.getElementById('themeBtn').textContent=dark?'☀️':'🌙';render(CURRENT);};
document.getElementById('globalSearch').addEventListener('keydown',function(e){if(e.key!=='Enter')return;var q=e.target.value.trim().toLowerCase();if(!q)return;var hit=RECORDS.find(function(r){return r.name.toLowerCase().indexOf(q)>=0;});if(hit){SELSTU=hit.id;setActiveNav('student');render('student');e.target.value='';}else{e.target.value='';}});

/* ============================================================ data load ============================================================ */
function setStatus(c,m){document.getElementById('srcDot').style.background=c;document.getElementById('srcStatus').textContent=m;}
function onData(p){try{
  ingestSupabase(p);buildNav();
  setStatus('var(--good)',(LANG==='ar'?'حي · ':'Live · ')+uniq(RECORDS.map(function(r){return r.id;})).length+(LANG==='ar'?' طالب · ':' students · ')+RECORDS.length+(LANG==='ar'?' سجل':' records'));
  document.getElementById('foot').textContent='v3.0 · '+RECORDS.length+(p.schoolName?' · '+p.schoolName:'');
  if(USER_ROLE==='manager'||USER_ROLE==='admin'){document.getElementById('uploadLinkSb').style.display='flex';}
  render(CURRENT);var l=document.getElementById('loader');l.style.opacity='0';setTimeout(function(){l.style.display='none';},400);
}catch(err){onErr(err);}}
function onErr(err){var msg=(err&&err.message?err.message:err);setStatus('var(--bad)','Error: '+msg);document.getElementById('loader').style.display='none';C().innerHTML='<div class="panel"><h3 style="color:var(--bad)">⚠️ '+t('noData')+'</h3><p class="sub">'+msg+'</p></div>';}
async function loadData(force){
  setStatus('var(--warn)','…');
  try{
    if(!force&&SUPABASE_CLIENT){var {data:{user}}=await SUPABASE_CLIENT.auth.getUser();if(!user){location.href='/';return;}}
    var hash=new URLSearchParams(location.hash.slice(1));
    var at=hash.get('access_token'),rt=hash.get('refresh_token');
    SUPABASE_CLIENT=supabase.createClient(SUPABASE_URL,ANON_KEY);
    if(at){await SUPABASE_CLIENT.auth.setSession({access_token:at,refresh_token:rt});history.replaceState(null,'',location.pathname);}
    var {data:{user}}=await SUPABASE_CLIENT.auth.getUser();
    if(!user){location.href='/';return;}
    var {data:profile}=await SUPABASE_CLIENT.from('user_profiles').select('school_id,role').eq('id',user.id).single();
    var schoolId=profile&&profile.school_id;
    if(!schoolId){onErr(new Error(LANG==='ar'?'لم يتم تعيين مدرسة لهذا الحساب':'No school assigned to this account'));return;}
    USER_ROLE=profile&&profile.role||'';
    var {data:schoolRec}=await SUPABASE_CLIENT.from('schools').select('name').eq('id',schoolId).single();
    var schoolName=schoolRec&&schoolRec.name||'';
    var {data:rec}=await SUPABASE_CLIENT.from('school_data').select('rows,config,created_at').eq('school_id',schoolId).order('created_at',{ascending:false}).limit(1).single();
    if(!rec||!rec.rows||!rec.rows.length){onErr(new Error(LANG==='ar'?'لا توجد بيانات — قم برفع بيانات الطلاب أولاً':'No data uploaded yet'));return;}
    onData({rows:rec.rows,config:rec.config||{},schoolName:schoolName});
  }catch(err){onErr(err);}
}
window.onload=function(){applyChrome();loadData(false);};
</script>
