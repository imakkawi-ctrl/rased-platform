<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>راصد — لوحة تحليل النتائج</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
:root{--bg:#0f1117;--panel:#1a1d27;--line:#2a2d3e;--txt:#e8eaf0;--dim:#8b8fa8;--blue:#5b8cff;--purple:#7c5cff;--green:#34d399;--yellow:#fbbf24;--red:#f87171;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:'Segoe UI',Tahoma,Arial,sans-serif;font-size:14px}
#loading{display:grid;place-items:center;min-height:100vh;font-size:18px;color:var(--dim)}
#app{display:none;flex-direction:column;min-height:100vh}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.logo{font-size:20px;font-weight:800;background:linear-gradient(135deg,var(--blue),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#schoolName{color:var(--dim);font-size:13px}
#uploadLink{display:none;background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;padding:8px 20px;border-radius:10px;text-decoration:none;font-size:13px;font-weight:700}
main{padding:24px;max-width:1200px;margin:0 auto;width:100%}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}
select{background:var(--panel);border:1px solid var(--line);color:var(--txt);padding:8px 14px;border-radius:10px;font-family:inherit;font-size:13px;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:24px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;text-align:center}
.stat-label{font-size:11px;color:var(--dim);font-weight:700;margin-bottom:6px}
.stat-value{font-size:32px;font-weight:800}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:24px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
.card h3{font-size:14px;font-weight:700;margin-bottom:14px;color:var(--dim)}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12px}
.bar-row span:first-child{width:90px;text-align:right;flex-shrink:0;color:var(--dim)}
.bar-track{flex:1;background:var(--line);border-radius:6px;height:10px}
.bar-fill{height:10px;border-radius:6px;transition:width .5s}
.bar-row .pct{width:36px;text-align:left;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:var(--bg);padding:10px 12px;text-align:right;color:var(--dim);font-weight:700;border-bottom:1px solid var(--line)}
td{padding:9px 12px;border-bottom:1px solid var(--line)}
tr:hover td{background:rgba(91,140,255,.05)}
.badge{display:inline-block;padding:2px 9px;border-radius:6px;font-size:11px;font-weight:700}
.red{background:rgba(248,113,113,.15);color:var(--red)}
.green{background:rgba(52,211,153,.15);color:var(--green)}
.yellow{background:rgba(251,191,36,.15);color:var(--yellow)}
#emptyMsg{display:none;text-align:center;padding:60px 20px;color:var(--dim);font-size:16px}
</style>
</head>
<body>
<div id="loading">جاري تحميل البيانات...</div>
<div id="app">
  <header>
    <div>
      <div class="logo">راصد</div>
      <div id="schoolName"></div>
    </div>
    <a id="uploadLink" href="/dashboard/upload">رفع بيانات</a>
  </header>
  <main>
    <div id="emptyMsg">لا توجد بيانات محفوظة — قم برفع بيانات الطلاب أولاً</div>
    <div id="content" style="display:none">
      <div class="filters">
        <select id="filterGrade"><option value="">كل الصفوف</option></select>
        <select id="filterClass"><option value="">كل الفصول</option></select>
        <select id="filterSubject"><option value="">كل المواد</option></select>
        <select id="filterQ"><option value="">كل الفصول الدراسية</option><option value="Q1">الفصل الأول (Q1)</option><option value="Q2">الفصل الثاني (Q2)</option><option value="Q3">الفصل الثالث (Q3)</option><option value="Q4">الفصل الرابع (Q4)</option></select>
      </div>
      <div class="stats">
        <div class="stat"><div class="stat-label">الطلاب</div><div class="stat-value" id="sTotal" style="color:var(--blue)">0</div></div>
        <div class="stat"><div class="stat-label">متوسط الدرجات</div><div class="stat-value" id="sAvg" style="color:var(--green)">0%</div></div>
        <div class="stat"><div class="stat-label">الطلاب في خطر</div><div class="stat-value" id="sRisk" style="color:var(--red)">0</div></div>
        <div class="stat"><div class="stat-label">نسبة النجاح</div><div class="stat-value" id="sPass" style="color:var(--yellow)">0%</div></div>
      </div>
      <div class="grid2">
        <div class="card"><h3>أداء المواد</h3><div id="subjectBars"></div></div>
        <div class="card"><h3>توزيع الدرجات</h3><canvas id="distChart" height="200"></canvas></div>
      </div>
      <div class="card" style="margin-bottom:24px">
        <h3>قائمة الطلاب</h3>
        <div style="overflow-x:auto">
          <table><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table>
        </div>
      </div>
    </div>
  </main>
</div>
<script>
const SUPABASE_URL='https://majmtioaylcllzywtsli.supabase.co';
const ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1ham10aW9heWxjbGx6eXd0c2xpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0NzMyNTQsImV4cCI6MjA5ODA0OTI1NH0.2uBvzg7wourF1YNABELKKrGFoM8oBo675ioPjaKeLag';
let allStudents=[],subjects=[],cfg={},distChart=null;

function showEmpty(msg){
  document.getElementById('emptyMsg').style.display='block';
  document.getElementById('emptyMsg').textContent=msg||'لا توجد بيانات';
}

async function init(){
  const hash=new URLSearchParams(location.hash.slice(1));
  const at=hash.get('access_token'),rt=hash.get('refresh_token');
  const client=supabase.createClient(SUPABASE_URL,ANON_KEY);
  if(at){await client.auth.setSession({access_token:at,refresh_token:rt});history.replaceState(null,'',location.pathname);}
  const {data:{user}}=await client.auth.getUser();
  if(!user){location.href='/';return;}
  const {data:profile}=await client.from('user_profiles').select('school_id,role').eq('id',user.id).single();
  const schoolId=profile?.school_id;
  if(!schoolId){
    document.getElementById('loading').style.display='none';
    document.getElementById('app').style.display='flex';
    showEmpty('لم يتم تعيين مدرسة لهذا الحساب. تواصل مع المدير.');
    return;
  }
  if(profile?.role==='manager'||profile?.role==='admin')document.getElementById('uploadLink').style.display='inline-block';
  const {data:school}=await client.from('schools').select('name').eq('id',schoolId).single();
  if(school)document.getElementById('schoolName').textContent=school.name;
  const {data:rec}=await client.from('school_data').select('rows,config,created_at').eq('school_id',schoolId).order('created_at',{ascending:false}).limit(1).single();
  document.getElementById('loading').style.display='none';
  document.getElementById('app').style.display='flex';
  if(!rec||!rec.rows||!rec.rows.length){showEmpty('لا توجد بيانات محفوظة — قم برفع بيانات الطلاب أولاً');return;}
  allStudents=rec.rows;cfg=rec.config||{};subjects=cfg.subjects||[];
  populateFilters();
  document.getElementById('content').style.display='block';
  render();
}

function populateFilters(){
  const grades=[...new Set(allStudents.map(s=>s.grade).filter(Boolean))];
  const classes=[...new Set(allStudents.map(s=>s.class).filter(Boolean))];
  const fg=document.getElementById('filterGrade');
  const fc=document.getElementById('filterClass');
  const fs=document.getElementById('filterSubject');
  grades.forEach(g=>{const o=document.createElement('option');o.value=g;o.textContent=g;fg.appendChild(o);});
  classes.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;fc.appendChild(o);});
  subjects.forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;fs.appendChild(o);});
  [fg,fc,fs,document.getElementById('filterQ')].forEach(el=>el.addEventListener('change',render));
}

function getFiltered(){
  const g=document.getElementById('filterGrade').value;
  const c=document.getElementById('filterClass').value;
  return allStudents.filter(s=>(g?s.grade===g:true)&&(c?s.class===c:true));
}

function avg(nums){const v=nums.filter(n=>!isNaN(n)&&n!=null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:NaN;}

function getScore(st,subj,q){
  if(!st.grades)return NaN;
  if(subj){if(q)return st.grades[subj]?.[q]??NaN;return avg(Object.values(st.grades[subj]||{}));}
  const all=[];
  for(const s of subjects){if(q){all.push(st.grades[s]?.[q]??NaN);}else{all.push(avg(Object.values(st.grades[s]||{})));}}
  return avg(all);
}

function render(){
  const filtered=getFiltered();
  const subj=document.getElementById('filterSubject').value;
  const q=document.getElementById('filterQ').value;
  const risk=cfg.risk||60,target=cfg.defaultTarget||80;
  const scores=filtered.map(s=>getScore(s,subj,q)).filter(n=>!isNaN(n));
  const overallAvg=avg(scores);
  const atRisk=filtered.filter(s=>{const sc=getScore(s,subj,q);return!isNaN(sc)&&sc<risk;}).length;
  const passing=scores.filter(n=>n>=target).length;
  document.getElementById('sTotal').textContent=filtered.length;
  document.getElementById('sAvg').textContent=isNaN(overallAvg)?'—':overallAvg.toFixed(1)+'%';
  document.getElementById('sRisk').textContent=atRisk;
  document.getElementById('sPass').textContent=scores.length?Math.round(passing/scores.length*100)+'%':'—';
  const bars=document.getElementById('subjectBars');
  bars.innerHTML='';
  const subjList=subj?[subj]:subjects;
  subjList.forEach(s=>{
    const vals=filtered.map(st=>getScore(st,s,q)).filter(n=>!isNaN(n));
    const a=avg(vals);const pct=isNaN(a)?0:Math.round(a);
    const color=pct>=target?'var(--green)':pct>=risk?'var(--yellow)':'var(--red)';
    bars.innerHTML+=`<div class="bar-row"><span>${s}</span><div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div><span class="pct">${isNaN(a)?'—':pct+'%'}</span></div>`;
  });
  const buckets=[0,0,0,0,0];
  scores.forEach(sc=>{if(sc<50)buckets[0]++;else if(sc<60)buckets[1]++;else if(sc<70)buckets[2]++;else if(sc<80)buckets[3]++;else buckets[4]++;});
  if(distChart)distChart.destroy();
  const ctx=document.getElementById('distChart').getContext('2d');
  distChart=new Chart(ctx,{type:'bar',data:{labels:['< 50','50-60','60-70','70-80','80+'],datasets:[{data:buckets,backgroundColor:['#f87171','#fb923c','#fbbf24','#34d399','#5b8cff'],borderRadius:6}]},options:{plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#8b8fa8'},grid:{color:'#2a2d3e'}},y:{ticks:{color:'#8b8fa8'},grid:{color:'#2a2d3e'}}}}});
  const thead=document.getElementById('tableHead');
  const tbody=document.getElementById('tableBody');
  const dispSubjs=subj?[subj]:subjects.slice(0,5);
  thead.innerHTML='<tr><th>الاسم</th><th>الصف</th><th>الفصل</th>'+dispSubjs.map(s=>`<th>${s}</th>`).join('')+'<th>المتوسط</th><th>الحالة</th></tr>';
  tbody.innerHTML=filtered.slice(0,100).map(s=>{
    const ra=getScore(s,subj,q);
    const color=isNaN(ra)?'':ra>=target?'green':ra>=risk?'yellow':'red';
    const label=isNaN(ra)?'—':ra>=target?'ممتاز':ra>=risk?'مقبول':'في خطر';
    return '<tr><td>'+s.name+'</td><td>'+s.grade+'</td><td>'+(s.class||'—')+'</td>'+
      dispSubjs.map(su=>{const v=getScore(s,su,q);return '<td>'+(isNaN(v)?'—':v.toFixed(1))+'</td>';}).join('')+
      '<td>'+(isNaN(ra)?'—':ra.toFixed(1)+'%')+'</td>'+
      '<td><span class="badge '+color+'">'+label+'</span></td></tr>';
  }).join('');
}

init().catch(err=>{
  document.getElementById('loading').style.display='none';
  document.getElementById('app').style.display='flex';
  showEmpty('خطأ في التحميل: '+err.message);
});
</script>
</body>
</html>
